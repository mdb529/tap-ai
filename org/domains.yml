# ---------------------------------------------------------------------------
# BUSINESS DOMAIN OWNERSHIP
#
# DESIGN NOTE / HONEST CAVEAT -------------------------------------------------
# An IdP does NOT know who owns "the canonical revenue definition." Okta knows
# org structure and group membership. Mapping business domain -> owner is a
# genuine ontology, and it is the one piece of ontology TapIQ cannot avoid
# owning something like.
#
# We keep the cost low three ways:
#   1. This file is small, flat, and human-editable -- it is CODEOWNERS for
#      business meaning, not a semantic graph.
#   2. It can be BOOTSTRAPPED rather than authored. Every tap has a "not me,
#      ask <person>" deflection button; deflections are the highest-signal
#      training data for this file. Start it wrong on purpose, let it converge.
#   3. Ownership is resolved lazily -- an unmapped domain does not block a tap,
#      it routes to the steward with "who should own this?" as the tap itself.
# ---------------------------------------------------------------------------

# Fallback recipient for any domain we cannot resolve.
default_steward: dpalmer@northharbor.health

domains:
  - key: finance.revenue
    label: Net patient revenue
    department: Finance
    owner: rmarsh@northharbor.health
    backup: tchen@northharbor.health
